<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Howe Wu Dashboard</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Howe" />
<meta name="theme-color" content="#15161A" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script>(function(){ try{ var t=localStorage.getItem('hw_theme_me'); if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t); }catch(e){} })();</script>
<style>
  /* Same tokens and type as the client dashboard template (light = paper, dark = charcoal). */
  :root{
    --paper:#F4F3EF;--card:#FBFAF7;--ink:#181A1C;--ink-2:#5A5C5A;--ink-3:#9A9B96;
    --line:#E2E0D8;--line-2:#D2CFC4;
    --gain:#1E6E4C;--gain-soft:#E7F0EA;--behind:#A6432F;
    --gold:#B8860B;--gold-soft:#FFF8E1;--darkcard:#181A1C;--darkink:#F4F3EF;--dim:#A7A99F;--inputbg:#fff;
    --rec-g:#1E6E4C;--rec-y:#B8860B;--rec-r:#A6432F;
    --display:'Spectral',Georgia,serif;--ui:'Hanken Grotesk',system-ui,-apple-system,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --paper:#15161A;--card:#1C1E23;--ink:#ECEAE3;--ink-2:#9FA0A6;--ink-3:#6B6C72;
    --line:#2A2C32;--line-2:#3A3D45;
    --gain:#52B083;--gain-soft:#16281F;--behind:#C9684F;
    --gold:#D9AE4A;--gold-soft:#2A2410;--darkcard:#23262C;--darkink:#ECEAE3;--dim:#A7A99F;--inputbg:#15161A;
    --rec-g:#52B083;--rec-y:#D9AE4A;--rec-r:#C9684F;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;background:var(--paper);}
  body{background:var(--paper);color:var(--ink);font-family:var(--ui);line-height:1.45;-webkit-font-smoothing:antialiased;
       padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(56px + env(safe-area-inset-bottom,0px));transition:background .25s,color .25s;-webkit-tap-highlight-color:transparent;}
  .wrap{max-width:520px;margin:0 auto;padding-inline:16px;}
  button{font-family:inherit;color:inherit;}
  button:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible{outline:2px solid var(--gain);outline-offset:2px;}
  .num{font-variant-numeric:tabular-nums;}
  .masthead{padding:22px 0 16px;border-bottom:1px solid var(--line-2);}
  .masthead-row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .brand{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);}
  .mast-right{display:flex;align-items:center;gap:12px;}
  .theme-btn{background:transparent;border:1px solid var(--line-2);color:var(--ink-2);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .status{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:5px;color:var(--ink-3);}
  .status .led{width:7px;height:7px;border-radius:50%;background:var(--gain);}
  .client-name{font-family:var(--display);font-weight:500;font-size:30px;letter-spacing:-.01em;margin-top:14px;line-height:1.05;}
  .client-sub{font-family:var(--mono);font-size:11px;letter-spacing:.03em;color:var(--ink-2);margin-top:5px;}
  .sec-label{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin:26px 0 12px;}
  .sec-label::after{content:"";flex:1;height:1px;background:var(--line);}
  .sec-label .edit-hint{font-size:8.5px;letter-spacing:.12em;opacity:.8;}
  .paceline{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);text-align:center;padding:12px 4px 0;line-height:1.6;}
  .paceline strong{color:var(--ink);}
  .tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:4px;margin:20px 0 0;}
  .tab{flex:1;text-align:center;padding:10px 4px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;border-radius:8px;cursor:pointer;color:var(--ink-3);user-select:none;white-space:nowrap;}
  .tab.active{background:var(--ink);color:var(--paper);}
  .pos{color:var(--gain);}.neg{color:var(--behind);}.muted{color:var(--ink-3);}

  /* bodyweight */
  .nav-top{display:flex;justify-content:space-between;align-items:flex-end;}
  .nav-figure{font-family:var(--display);font-weight:600;font-size:58px;line-height:.92;letter-spacing:-.02em;cursor:pointer;}
  .nav-figure .unit{font-size:22px;font-weight:400;color:var(--ink-2);margin-left:4px;}
  .nav-figure .pencil{font-size:13px;color:var(--ink-3);margin-left:8px;vertical-align:middle;}
  .nav-input{font-family:var(--display);font-weight:600;font-size:46px;width:160px;border:none;border-bottom:2px solid var(--gain);background:transparent;color:var(--ink);outline:none;}
  .nav-delta{text-align:right;font-family:var(--mono);font-size:13px;line-height:1.3;}
  .nav-delta .big{font-size:16px;font-weight:600;display:block;}
  .ledger-bar{margin-top:30px;}
  .ledger-track{position:relative;height:8px;background:var(--line);border-radius:2px;}
  .ledger-fill{position:absolute;top:0;bottom:0;background:var(--gain);border-radius:2px;width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1);}
  .lmark{position:absolute;top:-5px;bottom:-5px;width:2px;transform:translateX(-1px);}
  .lmark span{position:absolute;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9px;white-space:nowrap;}
  .lmark.ms{background:var(--gold);} .lmark.ms span{top:-15px;color:var(--gold);}
  .lmark.goal{background:var(--ink);} .lmark.goal span{bottom:-15px;color:var(--ink);}
  .lmark.now{width:12px;height:12px;top:-2px;bottom:auto;border-radius:50%;background:var(--gain);border:2px solid var(--paper);transform:translateX(-6px);}
  .lmark.now span{top:-17px;color:var(--gain);font-weight:600;}
  .ledger-ends{display:flex;justify-content:space-between;margin-top:20px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);}
  .ledger-ends .goal{color:var(--ink);}

  /* charts */
  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 12px 8px;margin-top:12px;}
  .chart-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
  .chart-title{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);}
  .seg{display:flex;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:2px;}
  .seg button{border:none;background:transparent;font-family:var(--mono);font-size:9.5px;padding:4px 7px;border-radius:5px;color:var(--ink-3);cursor:pointer;}
  .seg button.on{background:var(--ink);color:var(--paper);}
  .wchart{width:100%;height:auto;display:block;}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:9.5px;color:var(--ink-3);padding:4px 2px 2px;}
  .legend i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px;}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;min-width:0;}
  .stat-v{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.1;}
  .stat-l{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:3px;line-height:1.25;}
  .exp-btn{margin-top:12px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);border:1px dashed var(--line-2);border-radius:8px;padding:9px 12px;text-align:center;cursor:pointer;user-select:none;}
  .exp-note{font-family:var(--mono);font-size:10px;color:var(--ink-3);text-align:center;padding:6px 0 8px;}

  /* cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .row-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:10px;}
  .row-title{font-weight:600;font-size:15px;}
  .row-meta{font-family:var(--mono);font-size:11px;color:var(--ink-2);text-align:right;}
  .row-meta b{color:var(--gain);}
  .wkdays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .wkd{border:1.5px solid var(--line-2);border-radius:10px;padding:10px 6px;text-align:center;min-width:0;}
  .wkd .ic{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line-2);margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--ink-3);}
  .wkd .nm{font-size:12px;font-weight:600;line-height:1.2;}
  .wkd .dt{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);margin-top:3px;}
  .wkd.done .ic{background:var(--gain);border-color:var(--gain);color:#fff;}
  .wkdays.full .wkd.done{border-color:var(--gain);background:var(--gain-soft);}
  .streak{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--darkcard);color:var(--darkink);border-radius:12px;margin-top:12px;gap:14px;}
  .streak-fig{font-family:var(--display);font-weight:600;font-size:42px;line-height:.9;}
  .streak-unit{font-size:13px;font-weight:500;color:var(--dim);}
  .streak-best{font-family:var(--mono);font-size:11px;color:var(--dim);}
  .pips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:156px;}
  .pip{width:15px;height:15px;border-radius:50%;background:var(--gain);display:flex;align-items:center;justify-content:center;font-size:9px;}
  .pip.star{background:var(--gain);color:#fff;}
  .pip.y{background:transparent;}
  .pip.y::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);}
  .pip.h{background:#4a4c52;opacity:.55;}
  .pip.o,.pip.c{background:transparent;border:1.5px solid #4a4d52;}
  .streak-key{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:8px;}
  .streak-key span{display:inline-flex;align-items:center;gap:4px;}
  .streak-key i{display:inline-block;width:9px;height:9px;border-radius:50%;}

  /* fuel */
  .daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .daynav button{background:transparent;border:1px solid var(--line-2);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:16px;}
  .daynav button:disabled{opacity:.3;cursor:default;}
  .daynav .dlabel{font-weight:600;font-size:14px;}
  .kc-big{font-family:var(--display);font-weight:600;font-size:40px;line-height:1;}
  .kc-big .of{font-family:var(--mono);font-size:13px;font-weight:400;color:var(--ink-3);margin-left:4px;}
  .meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:12px 0 8px;}
  .meter>div{height:100%;background:var(--gain);border-radius:4px;}
  .meter.hit>div{background:var(--gold);}
  .kc-sub{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);}
  .kc-sub b{color:var(--ink);}
  .food-list{list-style:none;margin-top:14px;border-top:1px solid var(--line);}
  .food-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
  .food-list li>span:first-child{min-width:0;}
  .food-list .fm{font-family:var(--mono);font-size:11px;color:var(--ink-2);white-space:nowrap;}
  .del{background:transparent;border:none;color:var(--ink-3);font-size:16px;cursor:pointer;padding:0 4px;}
  .food-empty{font-family:var(--mono);font-size:11px;color:var(--ink-3);padding:12px 0 2px;}
  .food-add{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
  .food-add input,.lift-log input{font-family:var(--mono);font-size:16px;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--inputbg);color:var(--ink);min-width:0;}
  .food-add .fname{flex:1 1 100%;}
  .food-add .fnum{flex:1 1 0;}
  .mini-btn{font-weight:600;font-size:13px;padding:8px 14px;border-radius:8px;border:none;background:var(--gain);color:#fff;cursor:pointer;}

  /* training */
  .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .n{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 10px 10px;min-width:0;}
  .n-v{font-family:var(--display);font-weight:600;font-size:26px;line-height:1;}
  .n-v small{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--ink-3);margin-left:2px;}
  .n-l{font-family:var(--mono);font-size:9.5px;color:var(--ink-2);margin-top:6px;line-height:1.3;}
  .n-c{font-family:var(--mono);font-size:10px;margin-top:4px;}
  .days{display:flex;gap:6px;}
  .day{flex:1;padding:9px 6px;border-radius:999px;border:1px solid var(--line-2);font-size:12.5px;font-weight:600;cursor:pointer;text-align:center;background:transparent;white-space:nowrap;}
  .day.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .prog-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:10px;}
  .prog-name{font-family:var(--display);font-weight:600;font-size:21px;}
  .prog-tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gain);white-space:nowrap;}
  .prog-desc{font-size:13.5px;color:var(--ink-2);line-height:1.55;}
  .sub-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 0;}
  .positions{border-top:1px solid var(--line);margin-top:6px;}
  .pos-row{display:grid;grid-template-columns:1fr 60px auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .pos-row:last-child{border-bottom:none;}
  .pos-name{font-weight:600;font-size:15px;}
  .pos-name .pr{color:var(--gold);font-size:11px;margin-left:5px;}
  .pos-detail{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:2px;}
  .spark{width:60px;height:24px;display:block;}
  .pos-figs{text-align:right;}
  .pos-e1rm{font-family:var(--mono);font-size:14px;font-weight:600;white-space:nowrap;}
  .pos-chg{font-family:var(--mono);font-size:11px;margin-top:2px;}
  .pos-row.acc .pos-name{font-weight:500;}
  .pos-x{grid-column:1/-1;}
  .lift-log{display:flex;gap:8px;align-items:center;padding-top:10px;flex-wrap:wrap;}
  .lift-log input{width:84px;}
  .lift-log .x{font-family:var(--mono);color:var(--ink-3);}
  .log-day{width:100%;margin-top:14px;padding:13px;font-size:14px;}
  .prs{list-style:none;}
  .prs li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
  .prs li:last-child{border-bottom:none;}
  .prs .pv{font-family:var(--mono);font-size:12px;white-space:nowrap;}
  .prs .pv b{color:var(--gold);}

  /* coach + archive */
  .coach{padding:18px 20px;background:var(--card);border:1px solid var(--line);border-radius:12px;}
  .coach-from{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;}
  .coach-msg{font-family:var(--display);font-style:italic;font-size:16.5px;line-height:1.45;}
  .ck-week{margin-bottom:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);}
  .ck-head{cursor:pointer;padding:13px 15px;display:flex;justify-content:space-between;align-items:center;user-select:none;gap:10px;}
  .ck-wk-name{font-weight:600;font-size:14px;}
  .ck-wk-meta{font-family:var(--mono);font-size:11px;color:var(--ink-2);text-align:right;}
  .ck-body{padding:13px 15px;border-top:1px solid var(--line);}
  .ck-stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px;gap:10px;}
  .ck-stat-label{color:var(--ink-2);}
  .ck-stat-val{font-family:var(--mono);font-weight:600;text-align:right;}
  .ck-note{font-size:13px;color:var(--ink-2);line-height:1.5;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
  .ck-note b{color:var(--ink);}
  .updated{text-align:center;font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:28px;letter-spacing:.06em;cursor:pointer;user-select:none;}

  /* whoop */
  .wh-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .wh-name{font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:.24em;}
  .pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-3);white-space:nowrap;}
  .pill.gold{border-color:transparent;background:var(--gold-soft);color:var(--gold);}
  .wh-desc{font-size:13px;color:var(--ink-2);margin-top:8px;line-height:1.5;}
  .btn-ghost{margin-top:14px;width:100%;padding:12px;border-radius:9px;border:1px dashed var(--line-2);background:transparent;font-weight:600;font-size:13.5px;color:var(--ink-3);cursor:not-allowed;}
  .wh-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .wh{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0;}
  .wh.wide{grid-column:1/-1;}
  .wh-k{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);}
  .wh-v{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.1;margin-top:4px;}
  .wh-v small{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--ink-3);margin-left:3px;}
  .wh-s{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:3px;}
  .rec{display:flex;align-items:center;gap:14px;}
  .stack{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:10px;}
  .stack-l{display:flex;flex-wrap:wrap;gap:10px;font-family:var(--mono);font-size:9.5px;color:var(--ink-3);margin-top:7px;}
  .stack-l i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px;}
  .feeds{list-style:none;}
  .feeds li{padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;color:var(--ink-2);line-height:1.45;}
  .feeds li:last-child{border-bottom:none;}
  .feeds b{color:var(--ink);font-weight:600;}

  /* data sheet */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;}
  .sheet{width:100%;max-width:520px;background:var(--card);border-top-left-radius:16px;border-top-right-radius:16px;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);}
  .sheet h3{font-family:var(--display);font-size:20px;font-weight:600;}
  .sheet p{font-size:12.5px;color:var(--ink-2);margin:6px 0 10px;line-height:1.5;}
  .sheet textarea{width:100%;height:200px;font-family:var(--mono);font-size:11px;padding:10px;border-radius:8px;border:1px solid var(--line-2);background:var(--inputbg);color:var(--ink);resize:vertical;}
  .sheet .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

<script>
/* ---------------- helpers ---------------- */
function pad2(n){ return String(n).padStart(2,'0'); }
function ymd(d){ d=d||new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function pd(s){ var p=String(s).split('-'); return new Date(+p[0],(+p[1])-1,+p[2]); }
function addDays(s,n){ var d=pd(s); d.setDate(d.getDate()+n); return ymd(d); }
function diffDays(a,b){ return Math.round((pd(b)-pd(a))/864e5); }
function weekStart(s){ var d=pd(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); return ymd(d); }
function fmtDate(s){ return pd(s).toLocaleDateString('en-AU',{day:'numeric',month:'short'}); }
function fmtMon(s){ return pd(s).toLocaleDateString('en-AU',{month:'short'}); }
function fmtMonY(s){ return pd(s).toLocaleDateString('en-AU',{month:'short',year:'numeric'}); }
function dow(s){ return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][pd(s).getDay()]; }
function r1(n){ return Math.round(n*10)/10; }
function e1rm(w,r){ return w*(1+r/30); }
function byDate(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; }
function sum(a,f){ return a.reduce(function(t,x){ return t+(f?f(x):x)||t; },0); }
function avg(a){ return a.length? a.reduce(function(t,x){return t+x;},0)/a.length : null; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(x){ return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

function hash(s){ var h=5381; for(var i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return String(h); }
function k(n){ return n>=1000? r1(n/1000)+'k' : String(Math.round(n)); }

function shiftAll(o,n){
  if(Array.isArray(o)){ o.forEach(function(x){ shiftAll(x,n); }); return; }
  if(o&&typeof o==='object') Object.keys(o).forEach(function(key){
    var v=o[key];

  else if(a==='sheet'){ ui.sheet=true; ui.resetArmed=false; render(); }
  else if(a==='closesheet'){ if(e&&el.classList.contains('sheet-bg')&&e.target!==el) return; ui.sheet=false; render(); }
  else if(a==='copy'){ var ta=document.getElementById('json-out'), txt=ta.value, fb=function(){ ta.focus(); ta.select(); toast('Selected. Tap Copy in the menu'); }; try{ navigator.clipboard.writeText(txt).then(function(){toast('Copied');},fb); }catch(x){ fb(); } }
  else if(a==='reset'){ if(!ui.resetArmed){ ui.resetArmed=true; render(); return; } try{localStorage.removeItem(KEY);}catch(x){} D=JSON.parse(FILE_TEXT); prepare(); ui.sheet=false; ui.resetArmed=false; render(); toast('Back to file data'); }
}
var appEl=document.getElementById('app');
appEl.addEventListener('click',function(e){ var el=e.target.closest('[data-act]'); if(el&&!el.disabled) act(el,e); });
appEl.addEventListener('keydown',function(e){ if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"],[role="tab"]')){ e.preventDefault(); act(e.target,e); } });
appEl.addEventListener('submit',function(e){
  e.preventDefault(); var f=e.target, kk=f.dataset.f;
  if(kk==='food'){ var n=val('fd-n').trim(), kc=parseFloat(val('fd-k')), p=parseFloat(val('fd-p')); if(!n||isNaN(kc)){ toast('Add a name and calories'); return; }
    D.fuel.log.push({id:uid(),date:fuelDay,name:n,kcal:Math.round(kc),protein:isNaN(p)?null:Math.round(p)}); D.fuel.log.sort(byDate); save(); ui.refocus='fd-n'; render(); toast('Added'); }
  else if(kk==='lift'){ var m=mainById(f.dataset.id), r=parseInt(val('lr'),10), w=parseFloat(val('lw')); if(isNaN(r)||(!m.bodyweight&&isNaN(w))){ toast('Enter weight and reps'); return; }
    D.liftLog.push({date:TODAY,lift:m.id,weight:m.bodyweight?null:w,reps:r}); D.liftLog.sort(byDate); save(); render(); toast('Set logged'); }
  else if(kk==='acc'){ var an=val('an').trim(), aw=parseFloat(val('aw')), ar=parseInt(val('ar'),10); if(!an||isNaN(ar)){ toast('Enter a name and reps'); return; }
    D.liftLog.push({date:TODAY,lift:'acc',day:f.dataset.day,slot:parseInt(f.dataset.slot,10),name:an,weight:isNaN(aw)?null:aw,reps:ar}); D.liftLog.sort(byDate); save(); ui.open=null; render(); toast('Logged'); }
});

if(D) prepare();
render();
</script>
</body>
